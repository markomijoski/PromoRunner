<!DOCTYPE html>
<html lang="mk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(pageTitle='Assets')}"></head>
<body class="bg-amsm-soft">
<header class="bg-amsm-ink text-white">
  <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-4">
    <a href="/admin" class="font-display text-xl font-bold text-amsm-yellow">AMSM Admin</a>
    <nav class="flex flex-wrap gap-4 text-sm">
      <a href="/admin" class="hover:text-amsm-yellow">Dashboard</a>
      <a href="/admin/assets" class="text-amsm-yellow">Assets</a>
      <a href="/admin/leads" class="hover:text-amsm-yellow">Leads</a>
      <a href="/" class="hover:text-amsm-yellow">Site</a>
    </nav>
  </div>
</header>
<main class="mx-auto max-w-5xl px-4 py-10">
  <h1 class="font-display text-3xl font-bold">Game config</h1>
  <p class="mt-2 text-sm text-amsm-muted">За промена на spawn правила уредете <code>game-config.json</code> и рестартирајте.</p>
  <pre class="mt-6 overflow-x-auto rounded-xl border border-black/10 bg-white p-4 text-xs" th:text="${config}">{}</pre>
  <form class="mt-8 space-y-3 rounded-xl border border-black/10 bg-white p-5"
        id="upload-form">
    <h2 class="font-display text-xl font-bold">Upload image</h2>
    <input type="file" name="file" accept="image/*" required class="block w-full text-sm"/>
    <input type="text" name="subdirectory" value="ui" class="w-full rounded border px-3 py-2 text-sm" placeholder="subdirectory"/>
    <button type="submit" class="rounded-lg bg-amsm-yellow px-4 py-2 font-bold text-amsm-ink">Upload</button>
    <p id="upload-result" class="text-sm text-amsm-muted"></p>
  </form>
</main>
<script th:src="@{/js/app.js}"></script>
<script>
  document.getElementById('upload-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const res = await amsmFetch('/admin/api/assets/upload', { method: 'POST', body: fd });
    const data = await res.json().catch(() => ({}));
    document.getElementById('upload-result').textContent = res.ok ? ('Saved: ' + data.path) : (data.error || 'Error');
  });
</script>
</body>
</html>
