<!DOCTYPE html>
<html lang="mk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(pageTitle='Admin')}"></head>
<body class="bg-amsm-soft">
<header class="bg-amsm-ink text-white">
  <div class="mx-auto flex max-w-5xl flex-wrap items-center justify-between gap-3 px-4 py-4">
    <a href="/admin" class="font-display text-xl font-bold text-amsm-yellow">AMSM Admin</a>
    <nav class="flex flex-wrap gap-4 text-sm">
      <a href="/admin" class="text-amsm-yellow">Dashboard</a>
      <a href="/admin/assets" class="hover:text-amsm-yellow">Assets</a>
      <a href="/admin/leads" class="hover:text-amsm-yellow">Leads</a>
      <a href="/" class="hover:text-amsm-yellow">Site</a>
    </nav>
  </div>
</header>
<main class="mx-auto max-w-5xl px-4 py-10">
  <h1 class="font-display text-3xl font-bold text-amsm-ink">Dashboard</h1>
  <p class="mt-2 text-amsm-muted">Преглед на кампањата</p>
  <div id="analytics" class="mt-8 grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
    <div class="rounded-xl border border-black/10 bg-white p-5">
      <p class="text-xs uppercase tracking-wide text-amsm-muted">Играчи</p>
      <p class="font-display mt-2 text-3xl font-bold" data-k="totalPlayers">—</p>
    </div>
    <div class="rounded-xl border border-black/10 bg-white p-5">
      <p class="text-xs uppercase tracking-wide text-amsm-muted">Leads</p>
      <p class="font-display mt-2 text-3xl font-bold" data-k="totalLeads">—</p>
    </div>
    <div class="rounded-xl border border-black/10 bg-white p-5">
      <p class="text-xs uppercase tracking-wide text-amsm-muted">Просек</p>
      <p class="font-display mt-2 text-3xl font-bold" data-k="averageBestScore">—</p>
    </div>
    <div class="rounded-xl border border-black/10 bg-white p-5">
      <p class="text-xs uppercase tracking-wide text-amsm-muted">Игри</p>
      <p class="font-display mt-2 text-3xl font-bold" data-k="totalPlays">—</p>
    </div>
  </div>
</main>
<script th:src="@{/js/app.js}"></script>
<script>
  fetch('/admin/api/analytics', { credentials: 'same-origin' })
    .then(r => r.json())
    .then(data => {
      document.querySelectorAll('#analytics [data-k]').forEach(el => {
        const v = data[el.dataset.k];
        el.textContent = typeof v === 'number' ? (Number.isInteger(v) ? v : v.toFixed(1)) : '—';
      });
    }).catch(() => {});
</script>
</body>
</html>
