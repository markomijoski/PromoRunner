<!DOCTYPE html>
<html lang="mk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(pageTitle=${brand.name + ' · Лозинка'})}"></head>
<body class="road-lines" th:attr="data-authenticated=${authenticated}" x-data="amsmApp()">

<div th:replace="~{fragments/nav :: bar('legal')}"></div>

<main class="mx-auto max-w-md px-4 py-10 sm:px-6">
  <h1 class="font-display text-4xl font-extrabold text-amsm-ink">Нова лозинка</h1>

  <div th:if="${!tokenValid}" class="mt-6 rounded-xl border border-red-200 bg-red-50 p-4">
    <p class="text-sm text-red-800"
       th:text="${errorMessage != null ? errorMessage : 'Линкот е невалиден или истечен.'}">
      Invalid
    </p>
    <a href="/?modal=forgot" class="mt-4 inline-block text-sm font-semibold text-amsm-ink underline">
      Побарајте нов линк
    </a>
  </div>

  <div th:if="${tokenValid}" class="mt-6">
    <p class="text-sm text-amsm-muted">Изберете нова лозинка (најмалку 8 знаци).</p>
    <p th:if="${formError}"
       class="mt-3 rounded-lg bg-red-50 px-3 py-2 text-sm text-red-700"
       th:text="${formError}">Грешка</p>
    <form method="post" action="/auth/reset" class="mt-6 space-y-4">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
      <input type="hidden" name="token" th:value="${token}"/>
      <label class="block text-sm font-medium text-amsm-ink">
        Нова лозинка
        <input type="password"
               name="password"
               required
               minlength="8"
               autocomplete="new-password"
               class="mt-1.5 w-full rounded-lg border border-black/15 bg-white px-4 py-3 text-base outline-none focus:ring-2 focus:ring-amsm-yellow"/>
      </label>
      <label class="block text-sm font-medium text-amsm-ink">
        Потврди лозинка
        <input type="password"
               name="confirmPassword"
               required
               minlength="8"
               autocomplete="new-password"
               class="mt-1.5 w-full rounded-lg border border-black/15 bg-white px-4 py-3 text-base outline-none focus:ring-2 focus:ring-amsm-yellow"/>
      </label>
      <button type="submit" class="btn-primary btn-block btn-lg">
        Зачувај лозинка
      </button>
    </form>
  </div>

  <p class="mt-8 text-sm">
    <a href="/?modal=login" class="underline hover:text-amsm-ink">Најава</a>
    ·
    <a href="/" class="underline hover:text-amsm-ink">Дома</a>
  </p>
</main>

<script th:src="@{/js/app.js}"></script>
</body>
</html>
