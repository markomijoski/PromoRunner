<!DOCTYPE html>
<html lang="mk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(pageTitle=${brand.name})}"></head>
<body class="bg-[#F7F7F7]"
      th:attr="data-open-modal=${openModal}"
      x-data="amsmApp()"
      x-init="initFromQuery()">

<div th:replace="~{fragments/nav :: bar('game')}"></div>

<main class="mx-auto grid max-w-6xl gap-4 px-4 py-4 sm:px-6 lg:grid-cols-[1fr_280px] lg:gap-6 lg:py-6">
  <section class="relative overflow-hidden rounded-2xl border border-black/10 bg-white shadow-sm">
    <div id="game-canvas"
         class="game-stage w-full bg-[#e8e8e8]"
         style="min-height:420px;height:min(70dvh,720px)"></div>
    <p class="border-t border-black/5 px-4 py-2 text-center text-xs sm:text-sm" style="color:#5C5C5C">
      Space / ↑ скок · ↓ лизгање · мобилен: горен/долен дел од екранот
    </p>
    <div id="gate-overlay"
         class="absolute inset-0 z-20 hidden flex flex-col items-center justify-center p-6 text-center text-white"
         style="background:rgba(10,10,10,0.88)">
      <p class="font-display text-2xl font-bold">Нема преостанати игри</p>
      <p class="mt-2 max-w-sm text-sm" style="color:rgba(255,255,255,0.8)">
        Дајте согласност за маркетинг и продолжете неограничено.
      </p>
      <button type="button"
              class="mt-5 rounded-lg px-6 py-3 font-display font-bold uppercase"
              style="background:#FFD200;color:#0A0A0A"
              @click="openConsent()">
        Отвори согласност
      </button>
    </div>
    <div id="game-error"
         class="absolute inset-0 z-20 hidden flex flex-col items-center justify-center p-6 text-center"
         style="background:#F7F7F7">
      <p class="font-display text-xl font-bold" style="color:#0A0A0A">Не може да се стартува играта</p>
      <p id="game-error-msg" class="mt-2 text-sm" style="color:#5C5C5C"></p>
      <button type="button"
              class="mt-5 rounded-lg px-6 py-3 font-display font-bold uppercase"
              style="background:#FFD200;color:#0A0A0A"
              onclick="location.reload()">
        Обиди се повторно
      </button>
    </div>
  </section>

  <aside class="hidden md:block">
    <div th:replace="~{fragments/scoreboard :: table(${leaderboard}, ${currentUser.id})}"></div>
  </aside>
</main>

<div class="fixed inset-x-0 bottom-0 z-40 md:hidden"
     x-show="boardOpen"
     x-cloak
     style="display:none">
  <div class="absolute inset-0 -top-[100vh] bg-black/40" @click="boardOpen = false"></div>
  <div class="relative max-h-[70dvh] overflow-y-auto rounded-t-2xl bg-white p-2 shadow-2xl">
    <div class="mx-auto mb-2 h-1 w-10 rounded-full bg-black/15"></div>
    <div th:replace="~{fragments/scoreboard :: table(${leaderboard}, ${currentUser.id})}"></div>
  </div>
</div>

<script th:inline="javascript">
  window.GAME_CONFIG = /*[[${gameConfig}]]*/ {};
</script>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.87.0/dist/phaser.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/leaderboard.js}"></script>
<script th:src="@{/js/game.js(v=${#dates.createNow().getTime()})}"></script>

<div th:replace="~{fragments/modals :: shell}"></div>
</body>
</html>
