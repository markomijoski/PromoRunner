<!DOCTYPE html>
<html lang="mk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(pageTitle=${brand.name})}"></head>
<body class="bg-[#F7F7F7]"
      th:attr="data-open-modal=${openModal}, data-authenticated=${authenticated}"
      x-data="amsmApp()"
      x-init="initFromQuery()">

<div th:replace="~{fragments/nav :: bar('game')}"></div>

<main class="mx-auto grid max-w-6xl gap-4 px-4 py-2 sm:px-6 lg:grid-cols-[1fr_280px] lg:gap-6 lg:py-3">
  <section class="relative overflow-hidden rounded-2xl border border-black/10 bg-white shadow-sm">
    <div id="game-canvas"
         class="game-stage w-full bg-[#e8e8e8]"
         style="min-height:min(520px, calc(100dvh - 10rem));height:min(88dvh, calc(100dvh - 8rem), 960px)"></div>
    <p class="border-t border-black/5 px-4 py-2 text-center text-xs text-amsm-muted sm:text-sm">
      <span class="sm:hidden">Допир: лево/десно/горе · допрете за старт</span>
      <span class="hidden sm:inline">Стрелки / WASD · Space / ↑ или допир за старт · мобилен: лево/десно/горе/долу</span>
    </p>
    <div id="gate-overlay"
         class="absolute inset-0 z-20 hidden flex flex-col items-center justify-center p-6 text-center text-white"
         style="background:rgba(10,10,10,0.88)">
      <p class="font-display text-2xl font-bold">Нема преостанати игри</p>
      <p class="mt-2 max-w-sm text-sm text-white/80">
        Дајте согласност за маркетинг и продолжете неограничено.
      </p>
      <button type="button"
              class="btn-primary btn-lg mt-5"
              @click="openConsent()">
        Отвори согласност
      </button>
    </div>
    <div id="game-error"
         class="absolute inset-0 z-20 hidden flex flex-col items-center justify-center bg-amsm-soft p-6 text-center">
      <p class="font-display text-xl font-bold text-amsm-ink">Не може да се стартува играта</p>
      <p id="game-error-msg" class="mt-2 text-sm text-amsm-muted"></p>
      <button type="button"
              class="btn-primary btn-lg mt-5"
              onclick="location.reload()">
        Обиди се повторно
      </button>
    </div>
  </section>

  <aside class="hidden md:block">
    <div th:replace="~{fragments/scoreboard :: table(${leaderboard}, ${currentUser.id})}"></div>
  </aside>
</main>

<div class="fixed inset-x-0 bottom-0 z-40 md:hidden"
     x-show="boardOpen"
     x-cloak
     style="display:none">
  <div class="absolute inset-0 -top-[100vh] bg-black/40" @click="boardOpen = false"></div>
  <div class="relative max-h-[70dvh] overflow-y-auto rounded-t-2xl bg-white p-2 shadow-2xl">
    <div class="mx-auto mb-2 h-1 w-10 rounded-full bg-black/15"></div>
    <div th:replace="~{fragments/scoreboard :: table(${leaderboard}, ${currentUser.id})}"></div>
  </div>
</div>

<script th:inline="javascript">
  window.GAME_CONFIG = /*[[${gameConfig}]]*/ {};
</script>
<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/leaderboard.js}"></script>
<script th:src="@{/js/game.js(v=${#dates.createNow().getTime()})}"></script>

<div th:replace="~{fragments/modals :: shell}"></div>

<footer class="mx-auto max-w-6xl px-4 py-4 text-center text-xs text-amsm-muted">
  <a href="/privacy" class="hover:text-amsm-ink">Приватност</a>
  ·
  <a href="/terms" class="hover:text-amsm-ink">Услови</a>
</footer>
</body>
</html>
