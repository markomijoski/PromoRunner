<!DOCTYPE html>
<html lang="mk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(pageTitle=${brand.name + ' · Ранг'})}"></head>
<body class="road-lines"
      th:attr="data-authenticated=${authenticated}"
      x-data="amsmApp()">

<div th:replace="~{fragments/nav :: bar('leaderboard')}"></div>

<main class="mx-auto max-w-3xl px-4 py-10">
  <h1 class="font-display text-4xl font-extrabold text-amsm-ink">Ранг листа</h1>
  <p class="mt-2 text-amsm-muted" th:text="${brand.campaign}">Campaign</p>
  <div class="mt-8">
    <div th:replace="~{fragments/scoreboard :: table(${leaderboard}, ${currentUser != null ? currentUser.id : null})}"></div>
  </div>
  <div class="mt-8">
    <a href="/"
       class="inline-flex rounded-lg px-6 py-3 font-display font-bold uppercase"
       style="background:#FFD200;color:#0A0A0A">
      Играј
    </a>
  </div>
</main>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/leaderboard.js}"></script>
</body>
</html>
