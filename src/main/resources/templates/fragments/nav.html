<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>
<!-- Shared AMSM site header — same look on home, game, leaderboard -->
<header th:fragment="bar (active)"
        class="amsm-nav border-b border-black/10 bg-white text-amsm-ink"
        th:classappend="${active == 'game'} ? 'amsm-nav-game' : ''">
  <div class="mx-auto flex max-w-6xl items-center justify-between gap-2 px-4 sm:gap-3 sm:px-6"
       th:classappend="${active == 'game'} ? 'py-2' : 'py-4'">
    <a href="/"
       class="flex items-center gap-2 font-display text-2xl font-extrabold tracking-tight text-amsm-ink no-underline"
       th:attr="aria-label=${brand != null ? brand.name + ' — дома' : 'Дома'}">
      <span class="inline-flex h-8 w-8 items-center justify-center rounded-full bg-amsm-yellow text-sm font-black text-amsm-ink"
            style="box-shadow:inset 0 0 0 3px var(--color-ink)"
            aria-hidden="true"></span>
      АМСМ
    </a>

    <div class="flex flex-nowrap items-center justify-end gap-1.5 sm:gap-3 text-sm">
      <a th:if="${active != 'leaderboard' and active != 'game'}"
         href="/leaderboard"
         class="btn-ghost hidden sm:inline-flex text-amsm-muted">Ранг листа</a>
      <a th:if="${active == 'game'}"
         href="/leaderboard"
         class="btn-ghost hidden md:inline-flex text-amsm-muted">Ранг листа</a>
      <a th:if="${active == 'leaderboard'}"
         href="/"
         class="btn-ghost">← Дома</a>

      <!-- Game-only: open mobile scoreboard (Alpine boardOpen on body) -->
      <button th:if="${active == 'game'}"
              type="button"
              class="btn-secondary md:hidden"
              @click="boardOpen = !boardOpen">
        Ранг
      </button>

      <th:block th:if="${authenticated}">
        <span class="hidden max-w-[10rem] truncate text-amsm-muted sm:inline"
              th:text="${accountUser != null and accountUser.displayName != null and !#strings.isEmpty(accountUser.displayName) ? accountUser.displayName : 'Играч'}">user</span>
        <button type="button"
                class="btn-secondary"
                @click="modal = 'account'">
          Сметка
        </button>
        <!-- Logout in header on non-game pages; on game it lives in the account modal -->
        <form th:if="${active != 'game'}" method="post" action="/auth/logout" class="inline">
          <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
          <button type="submit" class="btn-primary">
            Одјава
          </button>
        </form>
      </th:block>

      <button th:unless="${authenticated}"
              type="button"
              class="btn-secondary"
              @click="openLogin()">Најава</button>
    </div>
  </div>
</header>
</body>
</html>
