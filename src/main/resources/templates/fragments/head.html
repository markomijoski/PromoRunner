<head th:fragment="head(pageTitle)" xmlns:th="http://www.thymeleaf.org">
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="theme-color" content="#FFD200"/>
  <meta name="_csrf" th:content="${_csrf.token}"/>
  <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
  <title th:text="${pageTitle} ?: ${brand.name}">AMSM Runner</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="anonymous"/>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Condensed:wght@500;600;700;800&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            amsm: {
              yellow: 'var(--color-primary)',
              ink: 'var(--color-ink)',
              muted: 'var(--color-muted)',
              soft: 'var(--color-soft)'
            }
          },
          fontFamily: {
            display: ['"Fira Sans Condensed"', 'sans-serif'],
            sans: ['"Source Sans 3"', 'sans-serif']
          }
        }
      }
    }
  </script>
  <!-- Brand tokens: do not use th:inline="css" — it escapes # to \# and breaks every amsm-* color -->
  <style th:utext="|    :root {
      --color-primary: ${brand.primaryColor};
      --color-ink: ${brand.secondaryColor};
      --color-bg: ${brand.backgroundColor};
      --color-muted: #5C5C5C;
      --color-soft: #F7F7F7;
    }
|">
  </style>
  <style>
    body {
      font-family: "Source Sans 3", sans-serif;
      background: var(--color-bg);
      color: var(--color-ink);
      min-height: 100dvh;
    }
    .font-display { font-family: "Fira Sans Condensed", sans-serif; }
    .road-lines {
      background-color: var(--color-bg);
      background-image:
        linear-gradient(90deg, transparent 0, transparent 47%, rgba(10,10,10,0.04) 49%, rgba(10,10,10,0.04) 51%, transparent 53%, transparent 100%),
        linear-gradient(180deg, var(--color-primary) 0, var(--color-primary) 6px, transparent 6px);
      background-size: 64px 100%, 100% 100%;
      background-repeat: repeat, no-repeat;
    }
    .reveal { animation: revealUp 0.55s ease both; }
    .reveal-delay-1 { animation-delay: 0.08s; }
    .reveal-delay-2 { animation-delay: 0.16s; }
    .reveal-delay-3 { animation-delay: 0.24s; }
    @keyframes revealUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .modal-panel { animation: modalIn 0.22s ease both; }
    @keyframes modalIn {
      from { opacity: 0; transform: translateY(18px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .pulse-live {
      animation: pulseLive 1.6s ease-in-out infinite;
    }
    @keyframes pulseLive {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.45; }
    }
    .rank-outline-gold,
    .rank-outline-silver,
    .rank-outline-bronze {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.15rem 0.35rem;
      border-radius: 0.35rem;
      border: 2px solid transparent;
      color: #0A0A0A;
      line-height: 1.1;
    }
    .rank-outline-gold {
      border-color: #D4AF37;
      background-color: #D4AF37;
    }
    .rank-outline-silver {
      border-color: #A8B0B8;
      background-color: #A8B0B8;
    }
    .rank-outline-bronze {
      border-color: #CD7F32;
      background-color: #CD7F32;
    }
    .htmx-request .btn-spinner { display: inline-block !important; }
    .btn-spinner { display: none; }
    .btn-primary,
    .btn-secondary,
    .btn-ghost {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      min-height: 2.75rem;
      border-radius: 0.5rem;
      padding: 0.625rem 1rem;
      font-family: "Fira Sans Condensed", sans-serif;
      font-weight: 700;
      line-height: 1.2;
      text-decoration: none;
      cursor: pointer;
      transition: transform 0.15s ease, filter 0.15s ease, background-color 0.15s ease, border-color 0.15s ease;
    }
    .btn-primary {
      border: 0;
      background: var(--color-primary);
      color: var(--color-ink);
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }
    .btn-primary:hover { filter: brightness(0.96); }
    .btn-primary:active { transform: scale(0.98); }
    .btn-secondary {
      border: 1px solid rgba(10, 10, 10, 0.2);
      background: #fff;
      color: var(--color-ink);
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
    }
    .btn-secondary:hover { background: var(--color-soft); }
    .btn-ghost {
      border: 0;
      background: transparent;
      color: var(--color-ink);
      font-weight: 600;
      text-transform: none;
      letter-spacing: 0;
      min-height: 2.5rem;
      padding: 0.5rem 0.75rem;
    }
    .btn-ghost:hover { color: var(--color-ink); background: rgba(10, 10, 10, 0.04); }
    .btn-primary:focus-visible,
    .btn-secondary:focus-visible,
    .btn-ghost:focus-visible,
    .home-play-btn:focus-visible {
      outline: 2px solid var(--color-ink);
      outline-offset: 3px;
    }
    .btn-block { width: 100%; }
    .btn-lg {
      min-height: 3.25rem;
      padding: 0.85rem 1.25rem;
      font-size: 1.125rem;
    }
    .home-play-btn {
      box-shadow: 0 2px 0 rgba(10, 10, 10, 0.12);
      transition: transform 0.18s ease, box-shadow 0.18s ease;
    }
    .home-play-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(10, 10, 10, 0.14);
    }
    .home-play-btn:active {
      transform: scale(0.98);
      box-shadow: 0 1px 0 rgba(10, 10, 10, 0.1);
    }
    html { scroll-behavior: smooth; }
    .prize-podium {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      align-items: end;
      gap: 0.75rem;
      max-width: 42rem;
      margin-left: auto;
      margin-right: auto;
    }
    @media (min-width: 640px) {
      .prize-podium { gap: 1.25rem; }
    }
    .podium-slot {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      min-width: 0;
    }
    .podium-place {
      font-family: "Fira Sans Condensed", sans-serif;
      font-weight: 800;
      font-size: 1.5rem;
      line-height: 1;
      color: #0A0A0A;
      margin: 0 0 0.5rem;
    }
    @media (min-width: 640px) {
      .podium-place { font-size: 2rem; }
    }
    .podium-prize {
      font-family: "Fira Sans Condensed", sans-serif;
      font-weight: 700;
      font-size: 0.85rem;
      line-height: 1.25;
      color: #0A0A0A;
      margin: 0 0 0.75rem;
      min-height: 2.5rem;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    @media (min-width: 640px) {
      .podium-prize { font-size: 1.05rem; min-height: 3rem; }
    }
    .podium-block {
      width: 100%;
      border: 3px solid #0A0A0A;
      border-bottom: 0;
    }
    .podium-block-gold {
      height: 8.5rem;
      background: #D4AF37;
    }
    .podium-block-silver {
      height: 6rem;
      background: #A8B0B8;
    }
    .podium-block-bronze {
      height: 4.25rem;
      background: #CD7F32;
    }
    @media (min-width: 640px) {
      .podium-block-gold { height: 11rem; }
      .podium-block-silver { height: 8rem; }
      .podium-block-bronze { height: 5.5rem; }
    }
    #game-canvas.game-stage {
      position: relative;
      overflow: hidden;
    }
    #game-canvas.game-stage canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }
    @media (max-width: 767px) {
      #game-canvas.game-stage {
        min-height: min(70dvh, calc(100dvh - 9rem)) !important;
        height: min(82dvh, calc(100dvh - 7.5rem)) !important;
      }
    }
    @media (max-height: 500px) and (orientation: landscape) {
      #game-canvas.game-stage {
        min-height: calc(100dvh - 6.5rem) !important;
        height: calc(100dvh - 5.5rem) !important;
      }
      body .amsm-nav {
        padding-top: 0.35rem;
        padding-bottom: 0.35rem;
      }
    }
    [x-cloak] { display: none !important; }
  </style>
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.8/dist/cdn.min.js"></script>
  <script src="https://unpkg.com/htmx.org@2.0.4"></script>
</head>
