<!DOCTYPE html>
<html lang="mk" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/head :: head(pageTitle=${brand.name})}"></head>
<body class="road-lines"
      th:attr="data-open-modal=${openModal}, data-modal-error=${modalError}"
      x-data="amsmApp()"
      x-init="initFromQuery()">

<div th:replace="~{fragments/nav :: bar('home')}"></div>

<main class="mx-auto grid max-w-6xl gap-10 px-4 py-10 sm:px-6 lg:grid-cols-[1.2fr_0.8fr] lg:items-start lg:gap-12 lg:py-16">
  <section class="reveal">
    <p class="font-display text-sm font-semibold uppercase tracking-[0.2em] text-amsm-muted">Кампања</p>
    <h1 class="mt-3 font-display text-5xl font-extrabold leading-[0.95] tracking-tight text-amsm-ink sm:text-6xl lg:text-7xl"
        th:text="${brand.name}">AMSM Runner</h1>
    <p class="reveal reveal-delay-1 mt-5 max-w-md text-lg text-amsm-muted sm:text-xl"
       th:text="${brand.campaign}">Campaign</p>

    <div class="reveal reveal-delay-2 mt-8 flex flex-col gap-3 sm:flex-row sm:items-center">
      <button type="button"
              class="inline-flex min-h-[3.25rem] items-center justify-center rounded-lg bg-amsm-yellow px-8 py-3.5 font-display text-xl font-extrabold uppercase tracking-wide text-amsm-ink shadow-sm transition hover:brightness-95 active:scale-[0.98]"
              th:attr="data-auth=${authenticated}"
              @click="onPlay($el.dataset.auth === 'true')">
        Играј
      </button>
      <a href="/leaderboard"
         class="inline-flex min-h-[3.25rem] items-center justify-center rounded-lg border border-amsm-ink/15 px-6 py-3 font-semibold text-amsm-ink sm:hidden">
        Ранг листа
      </a>
    </div>
  </section>

  <aside class="reveal reveal-delay-3">
    <div th:replace="~{fragments/scoreboard :: table(${leaderboard}, ${currentUser != null ? currentUser.id : null})}"></div>
  </aside>
</main>

<footer class="mx-auto max-w-6xl px-4 pb-10 text-center text-xs text-amsm-muted sm:px-6 sm:text-left">
  <a href="https://amsm.mk/" class="hover:text-amsm-ink" rel="noopener" target="_blank">amsm.mk</a>
  · Авто-мото сојуз на Македонија
</footer>

<div th:replace="~{fragments/modals :: shell}"></div>

<script th:src="@{/js/app.js}"></script>
<script th:src="@{/js/leaderboard.js}"></script>
</body>
</html>
